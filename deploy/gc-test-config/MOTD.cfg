THESE RULES ARE YOUR FIRST WARNING!
━━━━━━━━━━━━━━━━━━━━
Rule 0: Community Health
➢ Admin rulings in-game stand. We are happy to discuss any concerns in our discord.
➢ We reserve the right to remove players as necessary to protect the health of our community.
━━━━━━━━━━━━
Rule 1: Abusive Behaviour
➢ There is zero tolerance for abusive behavior and bigotry in any form. This includes, but is not limited to racism, sexism, ableism (ex: "retard"), homophobia, and transphobia; harassment and bullying; hate speech and Nazism.
➢ Rule 1 infractions will result in an immediate ban from our services without warning.
━━━━━━━━━━━━
Rule 2: Conduct
➢ In-game channels are for gameplay discussion only. Administrative actions and policies are not to be discussed in-game. Admins may clear chat channels and remove individuals using them in a disruptive manner.
➢ The experience of all players should be respected. Streamers should use a delay or map cover when possible. Please refrain from advertising without prior permission on our servers or impersonating members, admins, or developers.
➢ All players should strive for competitive, fun matches. While the server does have auto-balancing enabled, we reserve the right to make manual squad adjustments should we see the need. We ask you keep server health in mind while using our services.
➢ Players should actively attempt to contribute to the team effort. You can contribute to your team by attacking or defending, running supplies, destroying enemy objectives such as radios, hunting artillery pieces or fobs, supply line disruption or scouting. If you are unsure if you are actively contributing to your team, you’re probably not.
➢ Riding ontop of vehicles, as well as utilizing weapons ontop of a vehicle whilst in motion is not allowed, as this has been determined as a bug. It'll be treated as an exploit.
━━━━━━━━━━━━
Rule 3: Gameplay
➢ Hindering, trolling, or griefing players or your team is not allowed. This includes teamkilling, destroying friendly assets, or keeping assets intentionally out of play for extended periods of time.
➢ You must acknowledge in game chat when you team kill. Intentional team killing is not tolerated on our servers.
➢ Ghosting and Teaming are prohibited. Do not share tactical information with the opposing team.
➢ Cheating, Hacking, and Exploiting are prohibited.
➢ Kit bashing (e.g., spawning as a Clone Commando and switching to HAT role while still alive) is strictly prohibited.
➢ Firing weapons from a vehicle while it is being transported by a LAAT or HMP carrier is strictly prohibited.
━━━━━━━━━━━━
Rule 4: Squads and Assets
→ Squads ←
➢ Squad Leaders must have a mic and communicate in English. SLs are expected to actively lead their Squads and contribute to the team.
➢ Do not create a squad you do not intend to lead. Squad Baiting or passing Squad Lead without prior consent is not permitted. If you make a squad by mistake, disband the squad.
➢ No locked squads under 4 players, unless with an armor claim or if they are actively contributing to the team via a task such as mortars or logistics.
→ Assets ←
➢ All Unnamed servers are considered name claim. Squad names should be exact or very similar name to the asset in the in-game vehicle list to be valid. Any vehicle requiring squad leader approval may be name claimed, excepting logis as they are considered team assets.
➢ First squad named after the asset has the asset. Command squad forfeits any claims. One vehicle claim per squad.
➢ Claims extend to respawn order. Wait for your vehicle to respawn; do not take another that respawned first without permission.
➢ Names that do not specify a vehicle- such as "Armor, Tank, or Air"- do not get claim. Vehicle nicknames such as "Walker, Snail, or Speeder" are also not valid claims as they do not match the in-game list.
➢ Claimed assets should be used in a timely manner. You are expected to be ready at main when your asset spawns. Claims left in main for extended periods may be invalidated by admins.
➢ You cannot solo vehicles that require crewman kits, you must have 2 crewman in the vehicle before leaving main. If you have lost a crew member, return to the nearest spawn and regroup when safe to do so.
➢ All players claiming Aircraft must be able to effectively pilot that vehicle. If you are unable to, your squad may be renamed and you’ll be asked to no longer pilot on our servers.
➢ Intentional ramming of any vehicles is strictly prohibited. 
━━━━━━━━━━━━
Rule 5: Main Camping
➢ No approaching or engaging within one FOB radius of the enemy main. This includes attacking enemy assets within the radius, or being physically within the radius. No benefit of the doubt will be given to players engaging near the enemy main!
➢ The enemy team may engage anything that has fired from within the FOB radius but still may not enter the radius to do so. Players shooting from within the radius forfeit their individual protection from the enemy team.
➢ Indirect fire must launch from outside the FOB radius.
➢ Main protection is not in effect when engaging within the radius is necessary to contest the active objective. This can include some first and last points on RAAS and some first points on Invasion. When in doubt, steer clear of the radius.
➢ These rules are written to encourage fair and equal application for everyone and to compensate for map design issues, not to provide a safe area to engage from or to guarantee safe transit. Act like there is a war on!
━━━━━━━━━━━━━
Rule 6: Seeding Rules
➢ Do not do anything that may harm the health of the seed. This includes removing spawn points, rushing habs, spawn killing, spamming explosives, or attempting to end the seed early.
➢ Seeding in the life blood of any Squad server. If you or your actions are having a negative effect on this process, regardless of that action being explicitly against the rules here, you will be removed.
